<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic RAG — Course Console (Full)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161C; --panel:#1B212B; --panel-raised:#212836;
    --line:#2C3542; --line-soft:#232B37;
    --text:#E4E8EE; --text-dim:#8D98A8; --text-faint:#5B6472;
    --accent:#5FB8C4; --accent-dim:#3C7C85; --signal:#E3A34D;
    --mono:'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px),linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:32px 32px;background-position:-1px -1px;
  }
  a{color:var(--accent);} ::selection{background:var(--accent-dim);color:#fff;}

  .app{display:flex;min-height:100vh;}
  .rail{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .rail-header{padding:0 22px 22px 22px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .rail-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent);margin:0 0 6px 0;}
  .rail-title{font-size:17px;font-weight:600;margin:0;line-height:1.3;}
  .rail-sub{font-size:12px;color:var(--text-dim);margin:6px 0 0 0;}
  .nav-item{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--text-dim);font-family:var(--sans);font-size:13.5px;padding:11px 22px;cursor:pointer;border-left:2px solid transparent;line-height:1.35;}
  .nav-item .n{font-family:var(--mono);font-size:11px;color:var(--text-faint);flex:0 0 20px;}
  .nav-item:hover{color:var(--text);background:var(--panel-raised);}
  .nav-item.active{color:var(--text);border-left:2px solid var(--accent);background:var(--panel-raised);}
  .nav-item.active .n{color:var(--accent);}

  .main{flex:1;min-width:0;padding:40px 48px 80px 48px;max-width:1020px;}
  .section-head{margin-bottom:24px;}
  .section-eyebrow{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin:0 0 8px 0;}
  .section-title{font-size:28px;font-weight:600;margin:0 0 10px 0;letter-spacing:-.01em;}
  .section-dek{font-size:15px;color:var(--text-dim);max-width:680px;line-height:1.55;margin:0;}
  .difficulty-badge{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--bg);background:var(--accent);padding:2px 8px;margin-top:10px;}

  .tabstrip{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:28px 0 0 0;}
  .tabbtn{background:none;border:none;color:var(--text-faint);font-family:var(--mono);font-size:11.5px;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tabbtn:hover{color:var(--text-dim);}
  .tabbtn.active{color:var(--accent);border-bottom:2px solid var(--accent);}
  .tabpanel{background:var(--panel);border:1px solid var(--line);border-top:none;padding:28px 30px;position:relative;}
  .tabpanel::before{content:"";position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-top:1px solid var(--accent);border-right:1px solid var(--accent);}

  .prose p{font-size:14.5px;line-height:1.75;color:var(--text);margin:0 0 14px 0;}
  .prose p:last-child{margin-bottom:0;}
  .prose h4{font-size:13px;color:var(--accent);font-family:var(--mono);margin:20px 0 8px 0;text-transform:none;}
  .prose ul{margin:0 0 14px 0;padding-left:18px;}
  .prose li{font-size:14px;line-height:1.65;margin-bottom:6px;color:var(--text);}

  .beginner-box{background:var(--panel-raised);border-left:3px solid var(--accent);padding:12px 16px;margin:16px 0;font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .beginner-box .bb-label{font-family:var(--mono);font-size:10.5px;color:var(--accent);display:block;margin-bottom:6px;}

  .kt-group{margin-bottom:18px;}
  .kt-group:last-child{margin-bottom:0;}
  .kt-group-title{font-family:var(--mono);font-size:11.5px;color:var(--signal);margin:0 0 10px 0;}
  .kt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .kt-list li{font-size:14px;line-height:1.6;padding-left:20px;position:relative;color:var(--text);}
  .kt-list li::before{content:"—";position:absolute;left:0;color:var(--accent);}
  .kt-list li b{color:var(--accent);font-weight:600;}

  .uc-grid{display:flex;flex-direction:column;gap:14px;}
  .uc-item{border:1px solid var(--line-soft);background:var(--panel-raised);padding:16px 18px;}
  .uc-item .uc-name{font-family:var(--mono);font-size:12.5px;color:var(--accent);margin:0 0 8px 0;}
  .uc-item .uc-body{font-size:13.5px;color:var(--text);line-height:1.65;margin:0 0 8px 0;}
  .uc-item .uc-why{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:0;padding-top:8px;border-top:1px dashed var(--line-soft);}
  .uc-item .uc-why b{color:var(--signal);font-family:var(--mono);font-size:10.5px;}
  .risk-block{margin-top:18px;background:transparent;border:1px dashed var(--signal);padding:14px 16px;font-size:13px;color:var(--signal);line-height:1.65;}
  .risk-block .risk-label{font-family:var(--mono);font-size:11px;display:block;margin-bottom:6px;}

  .flowpos{font-size:14.5px;line-height:1.7;color:var(--text);border-left:2px solid var(--signal);padding-left:16px;}

  .diagram-block{margin-bottom:24px;}
  .diagram-block:last-child{margin-bottom:0;}
  .diagram-wrap{background:#0F1319;border:1px solid var(--line-soft);padding:18px;overflow-x:auto;}
  .diagram-caption{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:10px;}

  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;}
  .ex-list li{font-size:14px;line-height:1.68;color:var(--text);border-bottom:1px solid var(--line-soft);padding-bottom:16px;}
  .ex-list li:last-child{border-bottom:none;padding-bottom:0;}
  .ex-list li .ex-tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--signal);border:1px solid var(--signal);padding:1px 6px;margin-right:8px;transform:translateY(-1px);}

  .code-block{background:#0D1116;border:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#C7D3E0;padding:18px 20px;overflow-x:auto;white-space:pre;}
  .code-tag{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:8px;display:block;}

  .prompt-block{background:var(--panel-raised);border:1px solid var(--accent-dim);border-left:3px solid var(--accent);padding:18px 20px;font-size:13.5px;line-height:1.7;color:var(--text);}
  .prompt-block .prompt-label{font-family:var(--mono);font-size:11px;color:var(--accent);display:block;margin-bottom:10px;}

  .qa-list{display:flex;flex-direction:column;gap:16px;}
  .qa-item{border:1px solid var(--line-soft);background:var(--panel-raised);}
  .qa-q{font-size:13.5px;font-weight:600;color:var(--text);padding:13px 16px;border-bottom:1px solid var(--line-soft);}
  .qa-q .qa-num{font-family:var(--mono);color:var(--accent);margin-right:8px;}
  .qa-a{font-size:13.5px;line-height:1.7;color:var(--text-dim);padding:13px 16px;}

  .gap-note{margin-top:18px;background:transparent;border:1px dashed var(--signal);padding:12px 14px;font-size:12.5px;color:var(--signal);font-family:var(--mono);line-height:1.6;}

  .rail-divider{margin:16px 22px 8px 22px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;}
  .project-badge{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--bg);background:var(--signal);padding:2px 8px;margin-top:10px;}

  .stack-table{width:100%;border-collapse:collapse;font-size:13px;}
  .stack-table th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--text-faint);padding:8px 12px;border-bottom:1px solid var(--line);}
  .stack-table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--text);line-height:1.55;vertical-align:top;}
  .stack-table td:first-child{color:var(--accent);font-family:var(--mono);font-size:12px;white-space:nowrap;}
  .stack-note{margin-top:16px;}

  .cm-list{display:flex;flex-direction:column;gap:14px;}
  .cm-item{border:1px solid var(--line-soft);background:var(--panel-raised);padding:16px 18px;}
  .cm-item .cm-sec{font-family:var(--mono);font-size:11px;color:var(--signal);margin:0 0 6px 0;}
  .cm-item .cm-choice{font-size:13.5px;color:var(--text);line-height:1.6;margin:0 0 8px 0;}
  .cm-item .cm-why{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:0;padding-top:8px;border-top:1px dashed var(--line-soft);}
  .cm-item .cm-why b{color:var(--accent);font-family:var(--mono);font-size:10.5px;}

  .ol-list{list-style:none;counter-reset:step;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .ol-list li{counter-increment:step;font-size:13.5px;line-height:1.65;color:var(--text);padding-left:34px;position:relative;}
  .ol-list li::before{content:counter(step);position:absolute;left:0;top:0;width:22px;height:22px;background:var(--panel-raised);border:1px solid var(--accent-dim);color:var(--accent);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;}

  .stretch-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .stretch-list li{font-size:13.5px;line-height:1.6;padding-left:20px;position:relative;color:var(--text-dim);}
  .stretch-list li::before{content:"+";position:absolute;left:0;color:var(--signal);font-family:var(--mono);}



  /* ===== V2 teaching & practitioner components ===== */
  .concept-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 20px 0;}
  .hero-card{background:var(--panel-raised);border:1px solid var(--line-soft);padding:15px 16px;min-height:112px;position:relative;}
  .hero-card::before{content:"";position:absolute;left:-1px;top:-1px;width:22px;border-top:2px solid var(--accent);}
  .hero-label{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-bottom:8px;letter-spacing:.04em;}
  .hero-value{font-size:13.5px;line-height:1.55;color:var(--text);}
  .hero-value b{color:var(--signal);}
  .teach-callout{border:1px solid var(--line);background:#151B23;padding:16px 18px;margin:18px 0;}
  .teach-title{font-family:var(--mono);font-size:11px;color:var(--signal);margin-bottom:8px;}
  .teach-callout p{font-size:13.5px;line-height:1.65;color:var(--text-dim);margin:0;}
  .decision-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .decision-table th{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
  .decision-table td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55;}
  .decision-table td:first-child{color:var(--accent);font-family:var(--mono);font-size:11.5px;white-space:nowrap;}
  .ladder{display:flex;flex-direction:column;gap:0;margin:16px 0;}
  .ladder-step{display:grid;grid-template-columns:118px 1fr 1fr;gap:12px;padding:12px 14px;border-left:2px solid var(--accent-dim);border-bottom:1px solid var(--line-soft);background:var(--panel-raised);}
  .ladder-step:last-child{border-bottom:none;}
  .ladder-level{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .ladder-main{font-size:13.5px;line-height:1.55;color:var(--text);}
  .ladder-tradeoff{font-size:12.5px;line-height:1.55;color:var(--text-dim);}
  .failure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0;}
  .failure-card{border:1px solid var(--line-soft);background:var(--panel-raised);padding:14px 15px;}
  .failure-card .f-name{font-family:var(--mono);font-size:11px;color:var(--signal);margin-bottom:6px;}
  .failure-card .f-body{font-size:13px;line-height:1.6;color:var(--text);}
  .failure-card .f-fix{font-size:12.5px;line-height:1.55;color:var(--text-dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft);}
  .metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0;}
  .metric-chip{border:1px solid var(--line-soft);padding:11px;background:#11161D;}
  .metric-chip .m{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-bottom:5px;}
  .metric-chip .v{font-size:12.5px;line-height:1.45;color:var(--text-dim);}
  .architecture-stack{border:1px solid var(--line);padding:14px;margin:14px 0;background:#0F1319;}
  .arch-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 10px;border-bottom:1px solid var(--line-soft);}
  .arch-row:last-child{border-bottom:none;}
  .arch-name{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .arch-desc{font-size:12.8px;line-height:1.55;color:var(--text);}
  .section-dek{max-width:760px;}
  @media (max-width: 900px){.concept-hero,.failure-grid,.metric-strip{grid-template-columns:1fr 1fr}.ladder-step{grid-template-columns:100px 1fr}.ladder-tradeoff{grid-column:2}.architecture-stack .arch-row{grid-template-columns:110px 1fr}}
  @media (max-width: 600px){.concept-hero,.failure-grid,.metric-strip{grid-template-columns:1fr}.ladder-step{grid-template-columns:1fr}.ladder-tradeoff{grid-column:auto}.architecture-stack .arch-row{grid-template-columns:1fr}}



  /* decision framework + how-it-works additions */
  .how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px;}
  .how-card{background:var(--panel-raised);border:1px solid var(--line-soft);padding:16px 18px;}
  .how-card h4{margin:0 0 10px 0!important;color:var(--accent)!important;font-size:12.5px!important;}
  .how-steps{margin:0;padding-left:20px;}
  .how-steps li{font-size:13px!important;line-height:1.6!important;margin-bottom:6px!important;color:var(--text-dim)!important;}
  .how-steps li b{color:var(--text);}
  .framework-intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 18px 0;}
  .framework-stat{background:var(--panel-raised);border:1px solid var(--line-soft);padding:12px 14px;}
  .framework-stat .fs-k{font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:5px;}
  .framework-stat .fs-v{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .decision-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .decision-table th{position:sticky;top:0;background:#151B23;text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);padding:9px 10px;border-bottom:1px solid var(--line);z-index:1;}
  .decision-table td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;color:var(--text-dim);}
  .decision-table td:first-child{color:var(--accent);font-family:var(--mono);font-size:11.5px;min-width:145px;}
  .decision-table td:nth-child(2){color:var(--text);min-width:250px;}
  .decision-table tr:hover td{background:rgba(95,184,196,.035);}
  .decision-table-wrap{overflow:auto;max-height:620px;border:1px solid var(--line-soft);}
  .check{font-family:var(--mono);color:var(--signal);font-size:11px;white-space:nowrap;}
  .decision-callout{margin-top:16px;border-left:3px solid var(--signal);background:var(--panel-raised);padding:14px 16px;font-size:13px;line-height:1.65;color:var(--text-dim);}



  .usecase-hero{border:1px solid var(--line);background:linear-gradient(135deg,var(--panel-raised),var(--panel));padding:22px 24px;margin-bottom:18px;}
  .usecase-hero .uc-kicker{font-family:var(--mono);font-size:10.5px;color:var(--signal);letter-spacing:.05em;margin-bottom:8px;}
  .usecase-hero h3{margin:0 0 8px;font-size:20px;font-weight:600;}
  .usecase-hero p{margin:0;color:var(--text-dim);font-size:13.5px;line-height:1.7;}
  .problem-grid,.spec-grid,.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0;}
  .problem-card,.spec-card,.brief-card{border:1px solid var(--line-soft);background:var(--panel-raised);padding:15px 17px;}
  .problem-card h4,.spec-card h4,.brief-card h4{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin:0 0 7px;}
  .problem-card p,.spec-card p,.brief-card p,.brief-card li{font-size:13px;line-height:1.65;color:var(--text-dim);}
  .brief-card ul{margin:7px 0 0;padding-left:18px;}
  .architecture-flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:14px 0 20px;}
  .architecture-flow .af-node{border:1px solid var(--accent-dim);background:#0F1319;padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--text);}
  .architecture-flow .af-arrow{color:var(--signal);font-family:var(--mono);}
  .checklist-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0 20px;}
  .checklist-table th{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-align:left;border-bottom:1px solid var(--line);padding:9px 10px;}
  .checklist-table td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55;color:var(--text-dim);}
  .checklist-table td:first-child{font-family:var(--mono);color:var(--text);white-space:nowrap;}
  .yes-pill,.no-pill,.maybe-pill{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 6px;border:1px solid var(--line);margin-right:5px;}
  .yes-pill{color:var(--accent);border-color:var(--accent-dim);}.no-pill{color:var(--text-faint);}.maybe-pill{color:var(--signal);border-color:var(--signal);}
  .spec-step{border-left:2px solid var(--accent-dim);padding:0 0 18px 18px;margin-left:6px;position:relative;}
  .spec-step:before{content:"";position:absolute;width:8px;height:8px;background:var(--accent);left:-5px;top:4px;}
  .spec-step h4{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin:0 0 6px;}
  .spec-step p,.spec-step li{font-size:13px;color:var(--text-dim);line-height:1.65;}
  .spec-step ul{margin:6px 0 0;padding-left:18px;}
  .project-story{border-left:3px solid var(--signal);background:var(--panel-raised);padding:15px 18px;margin:16px 0;}
  .project-story .story-label{font-family:var(--mono);font-size:10.5px;color:var(--signal);display:block;margin-bottom:6px;}
  @media (max-width:760px){.problem-grid,.spec-grid,.brief-grid{grid-template-columns:1fr;}}

  .prompt-suite{display:flex;flex-direction:column;gap:18px;}
  .build-prompt-card{border:1px solid var(--line);background:var(--panel-raised);}
  .build-prompt-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .build-prompt-head h3{font-size:14px;margin:2px 0 5px 0;color:var(--text);}
  .build-prompt-head p{font-size:12.5px;line-height:1.5;color:var(--text-dim);margin:0;}
  .build-prompt-num{font-family:var(--mono);font-size:10.5px!important;color:var(--accent)!important;}
  .copy-prompt-btn{flex:0 0 auto;background:transparent;border:1px solid var(--accent-dim);color:var(--accent);font-family:var(--mono);font-size:10.5px;padding:7px 10px;cursor:pointer;}
  .copy-prompt-btn:hover{background:var(--panel);}
  .build-prompt-text{margin:0;padding:18px 20px;background:#0D1116;color:#C7D3E0;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:640px;overflow:auto;}

  @media (max-width: 860px){.app{flex-direction:column;}.rail{position:relative;height:auto;width:100%;flex:none;}.main{padding:28px 20px 60px 20px;}}
  .tabbtn:focus-visible, .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="rail-header">
      <p class="rail-kicker">AGENTIC RAG — COURSE CONSOLE</p>

/* =========================================================
   REUSABLE SVG FLOW-DIAGRAM ENGINE (unchanged pattern from v1,
   now called per-diagram since a section can carry more than one)
========================================================= */
function renderFlowDiagram(spec){
  const NS = "http://www.w3.org/2000/svg";
  const w = spec.width || 760, h = spec.height || 220;
  const colors = {box:"#212836", boxline:"#3C7C85", boxtext:"#E4E8EE", decision:"#241C14", decisionline:"#E3A34D", edge:"#4A5A68", edgetext:"#8D98A8", accent:"#5FB8C4"};
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="${NS}" font-family="IBM Plex Mono, monospace">`;
  svg += `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${colors.edge}"/></marker></defs>`;
  spec.edges.forEach(e=>{
    const a = spec.nodes.find(n=>n.id===e.from), b = spec.nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const ax=a.x+a.w, ay=a.y+a.h/2, bx=b.x, by=b.y+b.h/2;
    let path;
    if (e.curve === "down") {
      const midY = Math.max(ay,by) + 46;
      path = `M${a.x+a.w/2},${a.y+a.h} C ${a.x+a.w/2},${midY} ${b.x+b.w/2},${midY} ${b.x+b.w/2},${b.y+b.h}`;
    } else {
      path = `M${ax},${ay} C ${ax+30},${ay} ${bx-30},${by} ${bx},${by}`;
    }
    svg += `<path d="${path}" fill="none" stroke="${colors.edge}" stroke-width="1.4" stroke-dasharray="${e.dashed?'4,3':'0'}" marker-end="url(#arrow)"/>`;
    if(e.label){
      const lx=(a.x+a.w/2+b.x+b.w/2)/2, ly = e.curve==="down" ? Math.max(ay,by)+50 : (ay+by)/2-8;
      svg += `<rect x="${lx-((e.label.length*5.6)/2)}" y="${ly-11}" width="${e.label.length*5.6}" height="16" fill="#12161C"/>`;
      svg += `<text x="${lx}" y="${ly}" fill="${colors.edgetext}" font-size="10.5" text-anchor="middle">${e.label}</text>`;
    }
  });
  spec.nodes.forEach(n=>{
    const isDecision = n.kind === "decision";
    svg += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="${isDecision?colors.decision:colors.box}" stroke="${isDecision?colors.decisionline:colors.boxline}" stroke-width="1.3" rx="2"/>`;
    if(!isDecision){
      svg += `<line x1="${n.x}" y1="${n.y}" x2="${n.x+6}" y2="${n.y}" stroke="${colors.accent}" stroke-width="1.5"/>`;
      svg += `<line x1="${n.x}" y1="${n.y}" x2="${n.x}" y2="${n.y+6}" stroke="${colors.accent}" stroke-width="1.5"/>`;
    }
    const lines = n.label.split("\n");
    const startY = n.y + n.h/2 - ((lines.length-1)*7);
    lines.forEach((line,i)=>{ svg += `<text x="${n.x+n.w/2}" y="${startY+i*14}" fill="${colors.boxtext}" font-size="11.5" text-anchor="middle">${line}</text>`; });
  });
  svg += `</svg>`;
  return svg;
}

from typing import TypedDict, List

llm = ChatOpenAI(model="gpt-4o-mini", temperature=0)

    docs: List[str]
    answer: str
    rounds: int

    return {"answer": chain.invoke({"context": context, "question": state["question"]})}

    detailedConcept: `
      <p>Walk through each pattern as a story about what the system does when retrieval might have gone wrong:</p>
      <ul>
        <li><b>Self-RAG</b> — the model checks itself at three separate points: should I even retrieve for this question? (not every question needs it) — are the documents I got actually relevant? — is my final answer actually supported by those documents? Each check can be a simple special "reflection token" the model emits, like a self-report card.</li>
        <li><b>Corrective RAG (CRAG)</b> — after retrieving, a grader (often the LLM itself) labels the documents as Correct, Ambiguous, or Incorrect. Correct → use as-is. Ambiguous → refine the query and try again. Incorrect → abandon this source entirely and fall back to something else, like a live web search.</li>
        <li><b>Iterative/recursive retrieval</b> — simplest of the four: retrieve, ask "do I have enough to answer?", and if not, refine the query and retrieve again — looping until satisfied or hitting a safety cap (covered fully in Control Flow, §6).</li>
        <li><b>Active retrieval (FLARE)</b> — the most different of the four: it doesn't wait until after a full retrieval pass. Instead, while the model is generating its answer token-by-token, if its own confidence drops mid-sentence (it's about to guess a fact it isn't sure of), it pauses, retrieves more information right then, and resumes generating.</li>
        <li><b>Adaptive retrieval</b> — not a separate algorithm so much as a dial: instead of always fetching a fixed number of documents (say, always top-5), the system estimates how hard the question is first and adjusts how much/how many rounds of retrieval to do accordingly.</li>
      </ul>

      tag: "langgraph — Corrective RAG (CRAG) and iterative retrieval as graphs",
      code: `from langgraph.graph import StateGraph, END
from typing import TypedDict, List, Literal

class CRAGState(TypedDict):
    question: str
    docs: List[str]
    grade: str
    answer: str

def retrieve(state: CRAGState, retriever):
    docs = retriever.invoke(state["question"])
    return {"docs": [d.page_content for d in docs]}

def grade_docs(state: CRAGState):
    grade = llm.invoke(
        f"Grade these docs for relevance to '{state['question']}' as "
        f"correct, ambiguous, or incorrect: {state['docs']}"
    ).content.strip().lower()
    return {"grade": grade}

def use_as_is(state: CRAGState):
    return {"answer": (naive_prompt | llm | StrOutputParser()).invoke(
        {"context": "\\n".join(state["docs"]), "question": state["question"]})}

def refine_and_use(state: CRAGState):
    refined_q = llm.invoke(f"Rewrite for better retrieval: {state['question']}").content
    return use_as_is({**state, "question": refined_q})

def web_fallback(state: CRAGState, web_search_fn):
    docs = web_search_fn(state["question"])
    return {"answer": (naive_prompt | llm | StrOutputParser()).invoke(
        {"context": "\\n".join(docs), "question": state["question"]})}

crag = StateGraph(CRAGState)
crag.add_node("retrieve", retrieve)
crag.add_node("grade", grade_docs)
crag.add_node("use_as_is", use_as_is)
crag.add_node("refine_and_use", refine_and_use)
crag.add_node("web_fallback", web_fallback)
crag.set_entry_point("retrieve")
crag.add_edge("retrieve", "grade")
crag.add_conditional_edges("grade", lambda s: s["grade"], {
    "correct": "use_as_is", "ambiguous": "refine_and_use", "incorrect": "web_fallback"
})
crag.add_edge("use_as_is", END)
crag.add_edge("refine_and_use", END)
crag.add_edge("web_fallback", END)
crag_app = crag.compile()`

    detailedConcept: `
      <p>Start from the simplest option and build up:</p>
      <ul>
        <li><b>Single-agent RAG</b> — one LLM, with retrieval exposed as just one of its available tools (alongside maybe a calculator, a web search tool, etc). The model itself decides when to call which tool. Simplest architecture, and the right default unless you have a specific reason to add more structure.</li>
        <li><b>ReAct pattern</b> — the specific loop most single agents actually run: Reason (think out loud about what to do next) → Act (call a tool, e.g. retrieve) → Observe (read the tool's result) → repeat. It's called ReAct because it interleaves Reasoning and Acting instead of planning everything upfront.</li>
        <li><b>Plan-and-execute</b> — instead of improvising one step at a time like ReAct, the model writes out a <i>full plan</i> first ("Step 1: look up X, Step 2: compare to Y, Step 3: summarize") and then an executor works through the plan in order. Better for long tasks with a knowable shape; worse when the task needs to change direction mid-way, since the whole plan was fixed upfront.</li>
        <li><b>Multi-agent RAG</b> — split the work across distinct roles: a <i>Planner</i> breaks the task into sub-questions, a <i>Retriever</i> executes searches for each, a <i>Critic</i> checks whether the retrieved results actually answer each sub-question, and a <i>Synthesizer</i> writes the final combined answer. Each role can be its own prompt (or even its own separate model call).</li>
        <li><b>Reflection/self-critique loops</b> — applying "generate → critique → refine" at the level of the whole answer, not just a single retrieval step (this is architecturally similar to Self-RAG from §3, but zoomed out to the entire response).</li>

      code: `from langgraph.prebuilt import create_react_agent
from langchain_core.tools import tool

@tool
def retrieve_tool(query: str) -> str:
    """Retrieve relevant documents for a query."""
    docs = retriever.invoke(query)
    return "\\n".join(d.page_content for d in docs)

# --- Single-agent ReAct, using LangGraph's prebuilt constructor ---
react_agent = create_react_agent(llm, tools=[retrieve_tool])
# react_agent.invoke({"messages": [("user", "What's the weather where the 2024 Olympics were held?")]})

# --- Multi-agent: planner / retriever / critic / synthesizer as a graph ---
class MAState(TypedDict):
    question: str
    plan: List[str]
    results: List[str]
    graded: List[str]
    answer: str

def planner(state: MAState):
    plan = llm.invoke(f"Decompose into ordered sub-questions (JSON list): {state['question']}")
    return {"plan": JsonOutputParser().parse(plan.content)}

def retriever_node(state: MAState):
    results = [retrieve_tool.invoke(sub_q) for sub_q in state["plan"]]
    return {"results": results}

def critic(state: MAState):
    graded = [llm.invoke(f"Does this cover '{sq}'? {r}").content for sq, r in zip(state["plan"], state["results"])]
    return {"graded": graded}

def synthesizer(state: MAState):
    combined = "\\n".join(state["results"])
    return {"answer": (naive_prompt | llm | StrOutputParser()).invoke(
        {"context": combined, "question": state["question"]})}

ma = StateGraph(MAState)
ma.add_node("planner", planner)
ma.add_node("retriever", retriever_node)
ma.add_node("critic", critic)
ma.add_node("synthesizer", synthesizer)
ma.set_entry_point("planner")
ma.add_edge("planner", "retriever")
ma.add_edge("retriever", "critic")
ma.add_edge("critic", "synthesizer")
ma.add_edge("synthesizer", END)
ma_app = ma.compile()`

    whatIsThis: `
      <p>So far we've talked about "retrieval" as if it's always the same action against the same kind of database. In reality, an agent usually has several different places it could look — a document store, a SQL database, a live API, a knowledge graph — and retrieval is really a menu of tools the agent picks from, not one fixed action.</p>

    detailedConcept: `
      <p>Think of five different "search engines," each good at a different kind of question:</p>
      <ul>
        <li><b>Vector search</b> — finds documents that are <i>semantically similar</i> in meaning to the query, even if they don't share exact words. Good for "find me anything about topic X."</li>
        <li><b>Keyword/BM25 search</b> — finds documents that share <i>exact terms</i> with the query. Good for precise jargon, acronyms, product codes, or names that a semantic search might blur together with similar-sounding things.</li>
        <li><b>SQL/structured queries</b> — for numeric or tabular facts ("how many," "what was the total," "which rows match this filter") — this isn't really "search" in the fuzzy sense, it's an exact database query.</li>
        <li><b>Live APIs</b> — for information that changes constantly and can't be pre-indexed (today's weather, current stock price, live inventory).</li>
        <li><b>Knowledge graphs</b> — for questions about <i>relationships</i> between things ("what depends on X," "who reports to whom") — traversing edges between nodes rather than measuring similarity.</li>
      </ul>
      <p>Two techniques combine these:</p>
      <ul>
        <li><b>Hybrid search</b> fuses vector and keyword results together (usually via <i>reciprocal rank fusion</i> — a formula that rewards documents that rank well in either list) so you get the benefits of both semantic and exact matching in one ranked list.</li>
        <li><b>GraphRAG</b> uses the knowledge graph specifically for multi-hop, relational questions where similarity search alone would miss indirect connections.</li>
      </ul>
      <div class="beginner-box"><span class="bb-label">BEGINNER NOTE</span>A useful rule of thumb while learning: if the question has a number or an exact filter in it ("how many," "which ones from last week"), think SQL. If it's about relationships or dependencies, think graph. If it's just "find me stuff about this topic," think vector search, possibly boosted with keyword search for anything containing exact jargon.</div>

      <p>Every pattern in Sections 3-5 introduces a loop or a branch: "try again if not good enough," "route to source A or B," "keep going until confident." Control Flow is the discipline of making sure those loops actually stop, those branches are clearly defined, and the system has a safe fallback when it's genuinely stuck.</p>

    detailedConcept: `
      <p>Five concrete mechanisms make up Control Flow:</p>
      <ul>
        <li><b>Conditional branching</b> — explicit if/else logic that routes execution based on a grade, a confidence score, or a retrieved document's quality. This is literally what powers CRAG's Correct/Ambiguous/Incorrect split from §3.</li>
        <li><b>Loop termination conditions</b> — every loop needs two kinds of exit: a <i>soft</i> exit (a sufficiency check passes, confidence threshold is met — "we're done because we succeeded") and a <i>hard</i> exit (a max-rounds cap — "we're done because we have to stop, whether or not we succeeded"). You need both: the soft exit alone risks looping forever on a hard or adversarial question; the hard cap alone wastes effort on easy questions by always running the max.</li>
        <li><b>Confidence thresholds</b> — a number or category cutoff (e.g. "if groundedness score is below 0.7, don't answer") that gates whether the system proceeds, retries, or defers.</li>
        <li><b>Fallback strategies</b> — what actually happens when a threshold isn't met: escalate to a human, answer with an explicit uncertainty caveat, or plainly say "I don't know" rather than generate a confident-sounding guess.</li>
        <li><b>Human-in-the-loop checkpoints</b> — designed pause points where a human must approve or correct something before the agent proceeds — common (and often legally required) in high-stakes domains.</li>
      </ul>
      <div class="beginner-box"><span class="bb-label">BEGINNER NOTE</span>A useful mental test when you design any loop: "if this question is unanswerable, does my system know when to give up?" If the honest answer is "it would just keep retrying forever" or "it would eventually run out of money on API calls," you're missing a hard cap. This is one of the few sections where the "boring" engineering discipline is genuinely the whole point.</div>

      code: `class ControlledState(TypedDict):
    question: str
    docs: List[str]
    rounds: int
    sufficient: bool
    answer: str
    confidence: float

MAX_ROUNDS = 3
CONFIDENCE_THRESHOLD = 0.7

def retrieve_and_check(state: ControlledState):
    docs = retriever.invoke(state["question"])
    sufficient = llm.invoke(
        f"Is this enough context to answer '{state['question']}'? Reply yes/no.\\n{docs}"
    ).content.strip().lower().startswith("y")
    return {"docs": [d.page_content for d in docs], "sufficient": sufficient, "rounds": state["rounds"] + 1}

def should_continue(state: ControlledState) -> Literal["retrieve_and_check", "generate"]:
    if state["sufficient"] or state["rounds"] >= MAX_ROUNDS:
        return "generate"
    return "retrieve_and_check"

def generate_with_confidence(state: ControlledState):
    context = "\\n".join(state["docs"])
    answer = (naive_prompt | llm | StrOutputParser()).invoke(
        {"context": context, "question": state["question"]})
    confidence = float(llm.invoke(f"Rate 0-1 how grounded this answer is in the context: {answer}").content)
    if confidence < CONFIDENCE_THRESHOLD:
        return {"answer": "I'm not confident enough to answer — escalating to a human reviewer.", "confidence": confidence}
    return {"answer": answer, "confidence": confidence}

ctrl = StateGraph(ControlledState)
ctrl.add_node("retrieve_and_check", retrieve_and_check)
ctrl.add_node("generate", generate_with_confidence)
ctrl.set_entry_point("retrieve_and_check")
ctrl.add_conditional_edges("retrieve_and_check", should_continue,
    {"retrieve_and_check": "retrieve_and_check", "generate": "generate"})
ctrl.add_edge("generate", END)
ctrl_app = ctrl.compile()`

    detailedConcept: `
      <p>Four ideas matter here:</p>
      <ul>
        <li><b>Chunking strategies</b> — how you cut a long document into pieces. <i>Fixed-size</i> chunking just cuts every N characters, which is simple but can slice a sentence or table in half. <i>Semantic chunking</i> looks for places where the meaning shifts (a drop in embedding similarity between consecutive sentences) and cuts there instead. <i>Recursive splitting</i> tries to respect natural boundaries like paragraphs and headers before falling back to a raw character count. <i>Document-structure-aware</i> chunking goes further and explicitly splits along the document's real sections, tables, or headers.</li>
        <li><b>Embedding model selection</b> — which model turns text into vectors, and this is a real tradeoff: general-purpose embeddings are versatile but may miss domain nuance; domain-tuned embeddings (legal, code, medical) capture more nuance but cost more and are less flexible outside their domain.</li>
        <li><b>Multi-vector / parent-child (small-to-big) indexing</b> — index small chunks (so the similarity search is precise) but when a small chunk matches, return its larger parent section as the actual context fed to the model (so the model has enough surrounding context to actually use it).</li>
        <li><b>Metadata filtering</b> — attaching structured tags (date, department, document type) to each chunk so the system can pre-filter <i>before</i> doing semantic search, e.g. "only search policy documents from this year" — dramatically shrinking the search space and improving precision.</li>
      </ul>
      <div class="beginner-box"><span class="bb-label">BEGINNER NOTE</span>It helps to think of chunking as photography, not writing: you're deciding what's "in frame" for each piece of text. Cut too tight (small chunks) and you lose context; cut too wide (big chunks) and you dilute precision with irrelevant surrounding text. Small-to-big indexing is a clever way to get both: precise search, generous context.</div>

parent_splitter = RecursiveCharacterTextSplitter(chunk_size=2000, chunk_overlap=200)
child_splitter = RecursiveCharacterTextSplitter(chunk_size=300, chunk_overlap=50)

        <li><b>Context relevance</b> — of the documents we retrieved, how many are actually relevant to the question? (a retrieval-quality check)</li>
        <li><b>Context recall</b> — of all the documents that WOULD have been relevant, how many did we actually retrieve? (a retrieval-completeness check — did we miss something important?)</li>

    <div class="how-card"><h4>Iterative retrieval</h4><ol class="how-steps"><li>Retrieve once.</li><li>Ask whether the evidence is sufficient for every requested claim.</li><li>If not, identify the missing information and create the next query.</li><li>Repeat until sufficient or max rounds/tool budget is reached.</li></ol></div>

    <div class="how-card"><h4>Adaptive retrieval</h4><ol class="how-steps"><li>Estimate query complexity/risk.</li><li>Assign an effort tier: no retrieval, light retrieval, or deep retrieval.</li><li>Vary k, reranking, number of sources and retry depth by tier.</li><li>Measure whether extra effort creates enough quality lift to justify its cost.</li></ol></div>
  </div>`,

  "agent-architectures": `<div class="prose"><h4>HOW THE ARCHITECTURE PATTERNS OPERATE</h4></div><div class="how-grid">
    <div class="how-card"><h4>Single-agent tool calling</h4><ol class="how-steps"><li>Give one model a bounded list of tools.</li><li>The model chooses a tool and arguments.</li><li>The tool executes; result returns to the model.</li><li>The model either calls another tool or produces the answer.</li></ol></div>
    <div class="how-card"><h4>ReAct</h4><ol class="how-steps"><li>Reason about the next action.</li><li>Act by invoking one tool.</li><li>Observe the result.</li><li>Update state and repeat until the task is complete or budget is exhausted.</li></ol></div>
    <div class="how-card"><h4>Plan-and-execute</h4><ol class="how-steps"><li>Create a task plan before execution.</li><li>Validate/limit the plan.</li><li>Execute steps sequentially or in parallel where safe.</li><li>Replan only when evidence invalidates the original plan.</li></ol></div>
    <div class="how-card"><h4>Multi-agent</h4><ol class="how-steps"><li>Assign explicit roles with narrow responsibilities.</li><li>Pass typed state/evidence between roles.</li><li>Use a supervisor or graph to control hand-offs.</li><li>Aggregate results and run a final consistency/grounding check.</li></ol></div>
    <div class="how-card"><h4>Reflection loop</h4><ol class="how-steps"><li>Generate a candidate answer.</li><li>A critic checks completeness, correctness and evidence support.</li><li>Convert criticism into explicit fix instructions.</li><li>Regenerate only the weak parts; cap reflection rounds.</li></ol></div>
  </div>`,

  "tool-use-sources": `<div class="prose"><h4>HOW SOURCE SELECTION AND TOOL USE WORK</h4></div><div class="how-grid">
    <div class="how-card"><h4>Vector search</h4><ol class="how-steps"><li>Embed the query.</li><li>Compare it with embedded document chunks.</li><li>Return semantically similar candidates.</li><li>Apply metadata filters/reranking before synthesis.</li></ol></div>
    <div class="how-card"><h4>BM25 / lexical search</h4><ol class="how-steps"><li>Tokenize query and documents.</li><li>Score exact/rare term overlap.</li><li>Return keyword-strong matches.</li><li>Combine with dense results for hybrid recall when useful.</li></ol></div>
    <div class="how-card"><h4>SQL tool</h4><ol class="how-steps"><li>Translate analytical intent into a constrained query plan.</li><li>Resolve schema/table/metric definitions.</li><li>Generate and validate SQL.</li><li>Execute read-only SQL and return exact rows/aggregates with provenance.</li></ol></div>
    <div class="how-card"><h4>Knowledge graph</h4><ol class="how-steps"><li>Identify entities and relation types.</li><li>Traverse explicit edges/path constraints.</li><li>Return connected facts/path evidence.</li><li>Use text retrieval to explain or enrich those relationships.</li></ol></div>
    <div class="how-card"><h4>Web/API tools</h4><ol class="how-steps"><li>Recognize freshness or external-data need.</li><li>Call an approved API/search tool with bounded arguments.</li><li>Validate authority/date and normalize results.</li><li>Cite source and avoid silently mixing stale internal evidence with fresh external evidence.</li></ol></div>
  </div>`,

  "control-flow": `<div class="prose"><h4>HOW CONTROL FLOW KEEPS AN AGENT RELIABLE</h4></div><div class="how-grid">
    <div class="how-card"><h4>State machine / graph</h4><ol class="how-steps"><li>Represent query, evidence, decisions, counters and errors as explicit state.</li><li>Each node performs one bounded job.</li><li>Edges encode deterministic or model-based routing.</li><li>Persist trace state so failures can be replayed.</li></ol></div>
    <div class="how-card"><h4>Retry / correction loop</h4><ol class="how-steps"><li>Detect a specific failure such as low relevance or insufficient coverage.</li><li>Generate a targeted correction, not a blind retry.</li><li>Execute the corrected action.</li><li>Stop after a configured maximum or when expected gain is too low.</li></ol></div>
    <div class="how-card"><h4>Stopping criteria</h4><ol class="how-steps"><li>Define success conditions such as sufficient evidence and grounded answer.</li><li>Define effort limits: tool calls, rounds, tokens, money, latency.</li><li>Define failure exits: timeout, source outage, low confidence.</li><li>Return answer, abstention or escalation explicitly.</li></ol></div>
    <div class="how-card"><h4>Human escalation</h4><ol class="how-steps"><li>Detect high-risk or unresolved states.</li><li>Package question, evidence, attempted actions and uncertainty.</li><li>Hand off to a person with enough context to decide quickly.</li><li>Capture the resolution as future eval/training data where appropriate.</li></ol></div>
  </div>`,

  "chunking-indexing": `<div class="prose"><h4>HOW THE RETRIEVAL FOUNDATION WORKS</h4></div><div class="how-grid">
    <div class="how-card"><h4>Chunking</h4><ol class="how-steps"><li>Split documents at meaning-preserving boundaries.</li><li>Keep enough local context to answer a claim.</li><li>Attach document/page/section/version metadata.</li><li>Evaluate whether expected answer spans survive intact.</li></ol></div>
    <div class="how-card"><h4>Parent-child retrieval</h4><ol class="how-steps"><li>Index small child chunks for precise matching.</li><li>Retrieve the best child chunks.</li><li>Expand each hit to a larger parent section for answer context.</li><li>Deduplicate overlapping parents before generation.</li></ol></div>
    <div class="how-card"><h4>Hybrid search + reranking</h4><ol class="how-steps"><li>Run dense and lexical retrieval.</li><li>Fuse candidate lists.</li><li>Use a cross-encoder or reranker to score query-document relevance.</li><li>Pass only the best evidence into the LLM.</li></ol></div>
    <div class="how-card"><h4>Freshness / versioning / ACL</h4><ol class="how-steps"><li>Store timestamps, version and authorization metadata at ingestion.</li><li>Filter candidates before exposure to the model.</li><li>Prefer current authoritative versions.</li><li>Delete/update stale embeddings when source truth changes.</li></ol></div>
  </div>`,

  "evaluation": `<div class="prose"><h4>HOW TO EVALUATE AN AGENTIC RAG SYSTEM</h4></div><div class="how-grid">
    <div class="how-card"><h4>Build a gold set</h4><ol class="how-steps"><li>Collect representative easy, ambiguous, multi-hop, no-answer and adversarial queries.</li><li>Record expected answer/evidence/source behavior.</li><li>Tag each query by failure mode and risk.</li><li>Version the set as the system evolves.</li></ol></div>
    <div class="how-card"><h4>Evaluate retrieval</h4><ol class="how-steps"><li>Check whether the needed evidence appears in retrieved candidates.</li><li>Measure recall/precision/rank by query class.</li><li>Inspect misses before blaming generation.</li><li>Test freshness and permission filters separately.</li></ol></div>
    <div class="how-card"><h4>Evaluate trajectory</h4><ol class="how-steps"><li>Record route, rewritten queries, tools, retries and stop reason.</li><li>Score whether each decision was necessary/correct.</li><li>Detect loops and unnecessary tool calls.</li><li>Compare successful and failed traces to locate the weakest node.</li></ol></div>
    <div class="how-card"><h4>Evaluate final answer</h4><ol class="how-steps"><li>Score correctness/completeness.</li><li>Verify each material claim against evidence.</li><li>Check citations actually support the claims they accompany.</li><li>Measure abstention quality for unsupported questions.</li></ol></div>
    <div class="how-card"><h4>Evaluate economics</h4><ol class="how-steps"><li>Measure p50/p95 latency and cost/query.</li><li>Break cost by router, retrieval, grader, tools and synthesis.</li><li>Compare quality lift against naive/advanced RAG baseline.</li><li>Only retain agentic steps with measurable marginal value.</li></ol></div>
  </div>`,

  "production-use-cases": `<div class="prose"><h4>HOW TO TAKE AGENTIC RAG TO PRODUCTION</h4></div><div class="how-grid">
    <div class="how-card"><h4>1 · Baseline first</h4><ol class="how-steps"><li>Deploy a simple RAG baseline.</li><li>Instrument retrieval, generation, latency and cost.</li><li>Build a failure taxonomy from real queries.</li><li>Add agentic behavior only where a specific failure repeats.</li></ol></div>
    <div class="how-card"><h4>2 · Tier complexity</h4><ol class="how-steps"><li>Route easy traffic through the cheapest path.</li><li>Escalate only hard/risky traffic into grading, retries or multiple tools.</li><li>Use smaller models for classification/grading when validated.</li><li>Reserve stronger models for synthesis or genuinely hard reasoning.</li></ol></div>
    <div class="how-card"><h4>3 · Observe everything</h4><ol class="how-steps"><li>Trace query transforms, retrievals, tool calls and model decisions.</li><li>Attach latency, tokens and cost to every span.</li><li>Log stop reason and uncertainty.</li><li>Make problematic traces replayable in offline evals.</li></ol></div>
    <div class="how-card"><h4>4 · Release safely</h4><ol class="how-steps"><li>Run offline regression against the gold set.</li><li>Canary on a small traffic slice.</li><li>Compare quality, latency, cost and safety to baseline.</li><li>Rollback when any critical guardrail regresses.</li></ol></div>
  </div>`
};

const DECISION_FRAMEWORK = `
  <div class="framework-intro">
    <div class="framework-stat"><div class="fs-k">RULE 01</div><div class="fs-v">Start with the <b>simplest mechanism</b> that solves the observed failure.</div></div>
    <div class="framework-stat"><div class="fs-k">RULE 02</div><div class="fs-v">Add agency only when a query needs a <b>decision</b>, not because agents sound more advanced.</div></div>
    <div class="framework-stat"><div class="fs-k">RULE 03</div><div class="fs-v">Measure the marginal gain against <b>quality, latency, cost and safety</b>.</div></div>
    <div class="framework-stat"><div class="fs-k">RULE 04</div><div class="fs-v">For senior design reviews ask: <b>what failure signal triggers this functionality?</b></div></div>
  </div>
  <div class="decision-table-wrap"><table class="decision-table">
    <thead><tr><th>Functionality</th><th>When to use / problem to solve</th><th>Scenario</th></tr></thead>
    <tbody>
      <tr><td>Naive RAG</td><td><span class="check">□ USE WHEN</span> question is simple, corpus is clean, one retrieval pass reliably finds the answer.</td><td>“What is our return window?” over a small policy KB.</td></tr>
      <tr><td>Query rewriting</td><td><span class="check">□ USE WHEN</span> user wording is vague, conversational, shorthand-heavy or mismatched with corpus language.</td><td>“why sales down?” → “drivers of Q3 revenue decline by region”.</td></tr>
      <tr><td>HyDE</td><td><span class="check">□ USE WHEN</span> question-style text has poor semantic overlap with answer-style documents and recall is weak.</td><td>A plain-English medical/legal question searching formal technical passages.</td></tr>
      <tr><td>Query decomposition</td><td><span class="check">□ USE WHEN</span> the answer requires multiple dependent facts or calculations.</td><td>“Which advertisers raised spend after change X, and what happened to retention?”</td></tr>
      <tr><td>Query routing</td><td><span class="check">□ USE WHEN</span> different query types have different authoritative sources/tools.</td><td>Policy → docs; revenue → SQL; entity relationship → graph; current fact → web/API.</td></tr>
      <tr><td>Step-back prompting</td><td><span class="check">□ USE WHEN</span> an over-specific query retrieves little because the corpus explains the broader concept instead.</td><td>Specific failure symptom → first retrieve general system behavior, then narrow.</td></tr>
      <tr><td>Multi-query</td><td><span class="check">□ USE WHEN</span> vocabulary/synonym variation causes recall misses and one phrasing is brittle.</td><td>“attrition”, “churn”, “customer loss”, “drop-off” across differently authored docs.</td></tr>
      <tr><td>Hybrid search</td><td><span class="check">□ USE WHEN</span> you need both semantic similarity and exact keyword/entity/code matching.</td><td>Search product docs containing both conceptual intent and exact SKU/error code.</td></tr>
      <tr><td>Reranking</td><td><span class="check">□ USE WHEN</span> retrieval recall is acceptable but top results are poorly ordered or noisy.</td><td>Vector search returns 30 plausible chunks; reranker selects the 5 best for generation.</td></tr>
      <tr><td>CRAG</td><td><span class="check">□ USE WHEN</span> wrong or weak retrieved documents frequently pass silently into generation.</td><td>Support bot retrieves refund policy for the wrong product; grader rejects/switches source.</td></tr>
      <tr><td>Self-RAG</td><td><span class="check">□ USE WHEN</span> you need explicit decisions about whether to retrieve plus relevance and groundedness checks.</td><td>High-stakes research assistant must support every material claim with evidence.</td></tr>
      <tr><td>Iterative retrieval</td><td><span class="check">□ USE WHEN</span> one retrieval round often gives partial evidence and missing facts become visible only after reading results.</td><td>Summarize all policy changes over two years across multiple revisions.</td></tr>
      <tr><td>Adaptive retrieval</td><td><span class="check">□ USE WHEN</span> traffic mixes easy and hard questions and you need low average latency.</td><td>90% FAQ traffic uses one pass; 10% complex traffic gets grading/retries.</td></tr>
      <tr><td>FLARE / active retrieval</td><td><span class="check">□ USE WHEN</span> new information needs emerge during long-form generation.</td><td>Research report discovers midway that a new fact/citation is required.</td></tr>
      <tr><td>Vector DB tool</td><td><span class="check">□ USE WHEN</span> the task is semantic lookup over unstructured or semi-structured text.</td><td>Find passages explaining a product policy or design decision.</td></tr>
      <tr><td>BM25 / lexical tool</td><td><span class="check">□ USE WHEN</span> exact rare terms, IDs, codes or names matter.</td><td>Error code “E320_AUTO_SG” or a legal clause number.</td></tr>
      <tr><td>SQL tool</td><td><span class="check">□ USE WHEN</span> the answer is a precise aggregation/filter/join over structured data.</td><td>“What was yesterday's ad spend by segment?”</td></tr>
      <tr><td>Knowledge graph</td><td><span class="check">□ USE WHEN</span> relationships and multi-hop entity traversal are first-class.</td><td>Supplier → product → factory → region dependency analysis.</td></tr>
      <tr><td>Web / live API</td><td><span class="check">□ USE WHEN</span> freshness or an external source of truth is required.</td><td>Current stock price, latest regulation, shipping status.</td></tr>
      <tr><td>Single-agent + tools</td><td><span class="check">□ DEFAULT</span> when one model can own the task and tool selection without role conflicts.</td><td>Enterprise assistant with docs + SQL + calculator.</td></tr>
      <tr><td>ReAct</td><td><span class="check">□ USE WHEN</span> the next best action depends heavily on the previous observation.</td><td>Investigative support/debugging assistant exploring evidence step-by-step.</td></tr>
      <tr><td>Plan-and-execute</td><td><span class="check">□ USE WHEN</span> the task is long but its overall structure is knowable upfront.</td><td>Produce a competitive report with 8 predefined research steps.</td></tr>
      <tr><td>Multi-agent</td><td><span class="check">□ USE WHEN</span> roles truly need specialization, parallelism or independent critique and single-agent quality plateaus.</td><td>Planner + researchers + critic + synthesizer for deep multi-source research.</td></tr>
      <tr><td>Reflection / critique</td><td><span class="check">□ USE WHEN</span> first drafts are systematically incomplete or unsupported and critique has measurable lift.</td><td>Draft report → critic flags missing evidence → targeted revision.</td></tr>
      <tr><td>Parent-child retrieval</td><td><span class="check">□ USE WHEN</span> small chunks retrieve precisely but are too context-poor for generation.</td><td>Retrieve the exact paragraph, then expand to its full contract section.</td></tr>
      <tr><td>Freshness/version filtering</td><td><span class="check">□ USE WHEN</span> multiple versions exist and stale truth is dangerous.</td><td>HR or pricing policy where last year's document must never outrank current policy.</td></tr>
      <tr><td>ACL-aware retrieval</td><td><span class="check">□ ALWAYS</span> when corpus visibility differs by user/team.</td><td>Employee assistant must not retrieve executive-only compensation docs.</td></tr>
      <tr><td>Retry budget / stop criteria</td><td><span class="check">□ ALWAYS FOR LOOPS</span> to prevent infinite exploration, runaway cost and latency.</td><td>Maximum 3 retrieval rounds or 8 tool calls before answer/abstain/escalate.</td></tr>
      <tr><td>Human escalation</td><td><span class="check">□ USE WHEN</span> risk is high, evidence remains conflicting, or action is irreversible.</td><td>Legal/compliance answer remains uncertain after bounded retrieval.</td></tr>
      <tr><td>Trajectory evaluation</td><td><span class="check">□ USE FOR AGENTS</span> because final-answer accuracy cannot tell you whether routing/tool/retry decisions were efficient.</td><td>Answer is correct but took 12 unnecessary tool calls — trajectory eval catches it.</td></tr>
    </tbody>
  </table></div>
  <div class="decision-callout"><b>Fast classroom heuristic:</b> If the failure is <b>“I searched badly”</b> → query transformation / hybrid / reranking. If it is <b>“I searched the wrong place”</b> → routing/tool selection. If it is <b>“I don't know whether evidence is good enough”</b> → CRAG/Self-RAG/grading. If it is <b>“I need more facts after seeing the first facts”</b> → iterative/ReAct. If it is <b>“this task has many specialized sub-jobs”</b> → plan-and-execute or multi-agent. If it is <b>“the system can keep going forever”</b> → explicit stop budgets and escalation.</div>
`;

const PRACTITIONER_LENS = {
  "foundations": `
    <div class="concept-hero">
      <div class="hero-card"><div class="hero-label">BUSINESS PROBLEM</div><div class="hero-value">A fixed RAG pipeline treats every question as if it has the same difficulty, risk and information need.</div></div>
      <div class="hero-card"><div class="hero-label">AGENTIC DECISION</div><div class="hero-value"><b>Do I retrieve? Where? Again? Or stop?</b> The value is conditional compute: spend effort only when the query needs it.</div></div>
      <div class="hero-card"><div class="hero-label">PRODUCTION PAYOFF</div><div class="hero-value">Higher answer reliability on messy and multi-hop queries without forcing the maximum retrieval cost onto every request.</div></div>
    </div>
    <div class="teach-callout"><div class="teach-title">TEACH IT AS AN EVOLUTION, NOT A BUZZWORD</div><p>Start with an LLM that knows only what is in its weights. Add RAG so it can consult private/current knowledge. Then show the limitation: naive RAG can consult the library, but only once and using a fixed recipe. Agentic RAG adds a controller that can decide how to search, judge the evidence, try again, switch tools, or refuse. The breakthrough is not “more retrieval”; it is <b>adaptive control over retrieval</b>.</p></div>
    <div class="ladder">
      <div class="ladder-step"><div class="ladder-level">LEVEL 0</div><div class="ladder-main"><b>LLM only</b> — answer from model knowledge.</div><div class="ladder-tradeoff">Fast, but private/current facts may be absent or stale.</div></div>
      <div class="ladder-step"><div class="ladder-level">LEVEL 1</div><div class="ladder-main"><b>Naive RAG</b> — retrieve top-k once, then answer.</div><div class="ladder-tradeoff">Good baseline, but retrieval errors are silent and one-size-fits-all.</div></div>
      <div class="ladder-step"><div class="ladder-level">LEVEL 2</div><div class="ladder-main"><b>Advanced RAG</b> — reranking, hybrid search, better chunking, metadata.</div><div class="ladder-tradeoff">Improves search quality, but the control path is still mostly predetermined.</div></div>
      <div class="ladder-step"><div class="ladder-level">LEVEL 3</div><div class="ladder-main"><b>Agentic RAG</b> — route, decompose, grade, retry, switch source, stop.</div><div class="ladder-tradeoff">Best for variable-complexity tasks; adds latency, cost and more failure modes to govern.</div></div>
    </div>
    <div class="failure-grid">
      <div class="failure-card"><div class="f-name">FAILURE: RETRIEVAL MISS</div><div class="f-body">The right document exists, but the first query does not surface it.</div><div class="f-fix"><b>Agentic response:</b> rewrite, multi-query, step-back, alternate retriever.</div></div>
      <div class="failure-card"><div class="f-name">FAILURE: PARTIAL ANSWER</div><div class="f-body">A compound question requires several facts, but one retrieval only covers one part.</div><div class="f-fix"><b>Agentic response:</b> decompose into sub-questions and chain evidence.</div></div>
      <div class="failure-card"><div class="f-name">FAILURE: WRONG SOURCE</div><div class="f-body">A numeric question is sent to documents even though the answer lives in SQL.</div><div class="f-fix"><b>Agentic response:</b> route by intent and source capability.</div></div>
      <div class="failure-card"><div class="f-name">FAILURE: FALSE CONFIDENCE</div><div class="f-body">Retrieved text is weak, yet the model still produces fluent prose.</div><div class="f-fix"><b>Agentic response:</b> grade evidence, verify grounding, or abstain.</div></div>
    </div>`,

  "query-understanding": `
    <div class="concept-hero"><div class="hero-card"><div class="hero-label">PRACTITIONER PRINCIPLE</div><div class="hero-value">Retrieval cannot recover information the query never asked for correctly.</div></div><div class="hero-card"><div class="hero-label">COMMON SIGNAL</div><div class="hero-value">Search returns plausible-but-nearby content; users say “that is not what I meant.”</div></div><div class="hero-card"><div class="hero-label">FIRST FIX</div><div class="hero-value">Instrument the <b>transformed query</b>, route and sub-questions before tuning embeddings.</div></div></div>
    <div class="architecture-stack">
      <div class="arch-row"><div class="arch-name">Rewrite</div><div class="arch-desc">Use when wording is poor, shorthand-heavy or mismatched with corpus language. Guard against changing the user's intent.</div></div>
      <div class="arch-row"><div class="arch-name">Decompose</div><div class="arch-desc">Use for AND/COMPARE/CAUSE/BEFORE-AFTER questions. Preserve dependencies: later sub-questions may require earlier answers.</div></div>
      <div class="arch-row"><div class="arch-name">Route</div><div class="arch-desc">Route on source capability, not keywords alone: exact aggregates → SQL; policy narrative → docs; relationships → graph; fresh public facts → web.</div></div>
      <div class="arch-row"><div class="arch-name">Multi-query</div><div class="arch-desc">Raises recall but also duplicates noisy evidence. Always fuse and deduplicate; do not simply concatenate every result.</div></div>
      <div class="arch-row"><div class="arch-name">HyDE</div><div class="arch-desc">Useful for vocabulary mismatch, but the hypothetical document is a search probe—not evidence. Never cite it or treat it as ground truth.</div></div>
    </div>
    <div class="teach-callout"><div class="teach-title">SENIOR-LEARNER NUANCE</div><p>Query understanding is a policy layer. A mature system does not run every transformation on every query. It first classifies whether transformation is necessary, because unnecessary rewriting can damage a perfectly good query and create extra cost.</p></div>`,

  "retrieval-strategies": `
    <div class="concept-hero"><div class="hero-card"><div class="hero-label">WHAT CHANGES</div><div class="hero-value">Retrieval gains a <b>feedback loop</b> rather than being assumed correct.</div></div><div class="hero-card"><div class="hero-label">DESIGN QUESTION</div><div class="hero-value">What evidence is strong enough to proceed, and what action follows weak evidence?</div></div><div class="hero-card"><div class="hero-label">KEY RISK</div><div class="hero-value">An LLM grader can itself be wrong. Treat grading as a model with measurable precision/recall, not an oracle.</div></div></div>
    <table class="decision-table"><thead><tr><th>Pattern</th><th>Best fit</th><th>Main cost</th><th>Production nuance</th></tr></thead><tbody>
      <tr><td>CRAG</td><td>Bad documents are a common failure.</td><td>One or more grading calls.</td><td>Grade each document or evidence set against explicit criteria; generic “relevant?” prompts are too weak.</td></tr>

      <tr><td>FLARE-like</td><td>Long-form generation with emergent info needs.</td><td>Complex streaming/control.</td><td>Not a default for short QA; operational complexity can exceed the quality gain.</td></tr>
    </tbody></table>`,

  "agent-architectures": `
    <div class="concept-hero"><div class="hero-card"><div class="hero-label">DEFAULT</div><div class="hero-value"><b>Single agent first.</b> Add roles only when a measured failure needs specialization.</div></div><div class="hero-card"><div class="hero-label">WHEN TO SPLIT</div><div class="hero-value">Planning, retrieval, verification or synthesis repeatedly interfere with one another.</div></div><div class="hero-card"><div class="hero-label">ANTI-PATTERN</div><div class="hero-value">“Four agents because multi-agent sounds advanced.” More handoffs can reduce reliability.</div></div></div>
    <div class="failure-grid"><div class="failure-card"><div class="f-name">SINGLE AGENT OVERLOAD</div><div class="f-body">The model searches, analyzes, verifies and writes in one prompt and skips checks under complexity.</div><div class="f-fix">Split only the failing responsibility, e.g. dedicated verifier.</div></div><div class="failure-card"><div class="f-name">MULTI-AGENT TELEPHONE GAME</div><div class="f-body">A planner drops a constraint; retriever follows the wrong sub-question; synthesizer never sees the original intent.</div><div class="f-fix">Use explicit shared state, typed outputs, provenance and final constraint checks.</div></div></div>
    <div class="teach-callout"><div class="teach-title">ARCHITECTURE RULE OF THUMB</div><p>Choose architecture by <b>coordination need</b>, not task prestige. ReAct is good when the next action depends on the last observation. Plan-and-execute is good when the work can be decomposed upfront. Multi-agent is justified when independent roles have distinct objectives, tools, context windows or verification duties.</p></div>`,

  "tool-use-sources": `
    <div class="concept-hero"><div class="hero-card"><div class="hero-label">CORE IDEA</div><div class="hero-value">Different stores answer different kinds of questions. “One vector DB for everything” is a source-design mistake.</div></div><div class="hero-card"><div class="hero-label">ROUTING RULE</div><div class="hero-value">Select sources based on <b>data semantics</b>: narrative, exact facts, relationships, freshness.</div></div><div class="hero-card"><div class="hero-label">PROVENANCE</div><div class="hero-value">Every returned fact should retain source identity, retrieval time and evidence location through synthesis.</div></div></div>

      <span class="n">${s.num}</span><span>${s.title}</span>
    </button>
  `).join("") + `<p class="rail-divider">PROJECTS — HAND OFF TO CLAUDE CODE</p>` + PROJECTS.map(s => `
    <button class="nav-item ${s.id===activeSection?'active':''}" data-section="${s.id}">
      <span class="n">${s.num}</span><span>${s.title}</span>
    </button>
  `).join("");
  nav.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeSection = btn.dataset.section;
      const item = ALL_ITEMS.find(s=>s.id===activeSection);
      activeTab = item.kind === "project" ? "goal" : (item.id === "production-use-cases" ? "prodUseCase" : "whatIsThis");
      renderNav(); renderMain();
    });
  });
}

function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function tabContentHTML(section, tabKey){
  switch(tabKey){
    case "whatIsThis":
      return `<div class="prose">${section.whatIsThis}</div>`;
    case "detailedConcept":
      return `<div class="prose">${section.detailedConcept}</div>${HOW_IT_WORKS[section.id] || ""}`;
    case "keyTakeaways":
      return section.keyTakeaways.map(g => `
        <div class="kt-group">
          <p class="kt-group-title">${g.group}</p>
          <ul class="kt-list">${g.items.map(i=>`<li>${i}</li>`).join("")}</ul>
        </div>
      `).join("");
    case "useCases":
      return `<div class="uc-grid">${section.useCases.map(u=>`
        <div class="uc-item">
          <p class="uc-name">${u.name}</p>
          <p class="uc-body">${u.body}</p>
          <p class="uc-why"><b>WHY HERE</b> — ${u.why}</p>
        </div>
      `).join("")}</div>
      ${section.whatIfNotUsed ? `<div class="risk-block"><span class="risk-label">WHAT HAPPENS IF YOU SKIP THIS</span>${section.whatIfNotUsed}</div>` : ""}`;
    case "flowPosition":
      return `<div class="flowpos">${section.flowPosition}</div>`;
    case "diagram":
      return section.diagrams.map(d => `
        <div class="diagram-block">
          <div class="diagram-wrap">${renderFlowDiagram(d.spec)}</div>
          <p class="diagram-caption">${d.caption}</p>
        </div>
      `).join("");
    case "examples":
      return `<ul class="ex-list">${section.examples.map(e=>`<li><span class="ex-tag">${e.tag}</span>${e.text}</li>`).join("")}</ul>`;
    case "sampleCode":
      return `<span class="code-tag">${section.sampleCode.tag}</span><div class="code-block">${escapeHtml(section.sampleCode.code)}</div>`;
    case "claudePrompt":
      return `<div class="prompt-block"><span class="prompt-label">PROMPT — paste into Claude Code</span>${section.claudePrompt}</div>`;
    case "interviewQuestions":
      return `<div class="qa-list">${section.interviewQuestions.map((qa,i)=>`
        <div class="qa-item">
          <div class="qa-q"><span class="qa-num">Q${i+1}.</span>${qa.q}</div>
          <div class="qa-a">${qa.a}</div>
        </div>
      `).join("")}</div>`;
    case "practitionerLens":
      return PRACTITIONER_LENS[section.id] || `<div class="beginner-box">Practitioner guidance is integrated into this section's detailed concept and examples.</div>`;
    case "decisionGuide":
      return DECISION_GUIDES[section.id] || `<div class="beginner-box">Use the section's key takeaways and use cases as the decision guide.</div>`;
    case "decisionFramework":
      return DECISION_FRAMEWORK;

    case "prodUseCase": return PRODUCTION_WORKSHOP.prodUseCase;
    case "prodChecklist": return PRODUCTION_WORKSHOP.prodChecklist;
    case "prodSystemDesign": return PRODUCTION_WORKSHOP.prodSystemDesign;
    /* ---- project-kind tabs ---- */
    case "goal":
      return `<div class="prose">${section.goal}</div>`;
    case "deliverables":
      return `<ul class="ol-list">${section.deliverables.map(d=>`<li>${d}</li>`).join("")}</ul>`;
    case "stack":
      return `<table class="stack-table">
        <thead><tr><th>Layer</th><th>Choice</th><th>Why it's free</th></tr></thead>
        <tbody>${SHARED_STACK.map(r=>`<tr><td>${r.layer}</td><td>${r.choice}</td><td>${r.why}</td></tr>`).join("")}</tbody>
      </table>
      <span class="code-tag" style="margin-top:20px;">quickstart — wiring the free stack together (adapt directly, don't reinvent)</span>
      <div class="code-block">${escapeHtml(SHARED_STACK_CODE)}</div>
      <div class="risk-block stack-note"><span class="risk-label">NON-NEGOTIABLE</span>${SHARED_STACK_NOTE}</div>`;
    case "conceptMapping":
      return `<div class="cm-list">${section.conceptMapping.map(c=>`
        <div class="cm-item">
          <p class="cm-sec">${c.sec}</p>
          <p class="cm-choice">${c.choice}</p>
          <p class="cm-why"><b>WHY</b> — ${c.why}</p>
        </div>
      `).join("")}</div>`;
    case "buildOrder":
      return `<ul class="ol-list">${section.buildOrder.map(b=>`<li>${b}</li>`).join("")}</ul>
      <div class="gap-note">FINAL NOTE FOR CLAUDE CODE — ${FINAL_NOTE}</div>`;
    case "buildPrompts":
      return `<div class="prompt-suite">
        <div class="beginner-box"><span class="bb-label">HOW TO USE THESE</span>Start with the Master Build Prompt in a new repository. Once the application works end to end, use the QA/Evaluation prompt. Use the Demo Polish prompt last. Each prompt is intentionally self-contained and can be pasted directly into Claude Code or Codex.</div>
        ${section.buildPrompts.map((bp,i)=>`
          <div class="build-prompt-card">
            <div class="build-prompt-head"><div><p class="build-prompt-num">PROMPT ${i+1}</p><h3>${bp.title}</h3><p>${bp.when}</p></div><button class="copy-prompt-btn" data-copy-target="build-prompt-${section.id}-${i}">COPY PROMPT</button></div>
            <pre class="build-prompt-text" id="build-prompt-${section.id}-${i}">${escapeHtml(bp.prompt)}</pre>
          </div>`).join("")}
      </div>`;
    case "stretchGoals":
      return `<ul class="stretch-list">${section.stretchGoals.map(s=>`<li>${s}</li>`).join("")}</ul>`;
    default: return "";
  }
}

function renderMain(){
  const section = ALL_ITEMS.find(s=>s.id===activeSection);
  const isProject = section.kind === "project";
  const tabs = isProject ? PROJECT_TABS : (section.id === "production-use-cases" ? PRODUCTION_TABS : CONCEPT_TABS);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="section-head">
      <p class="section-eyebrow">${isProject ? "PROJECT" : "SECTION"} ${section.num}</p>
      <h1 class="section-title">${section.title}</h1>
      <p class="section-dek">${section.dek}</p>
      ${isProject ? `<span class="project-badge">HAND-OFF SPEC — FREE OF COST</span>` : ""}
    </div>
    <div class="tabstrip">
      ${tabs.map(t=>`<button class="tabbtn ${t.key===activeTab?'active':''}" data-tab="${t.key}">${t.label}</button>`).join("")}
    </div>
    <div class="tabpanel" id="tabpanel">${tabContentHTML(section, activeTab)}</div>
    ${section.gapNote ? `<div class="gap-note">${section.gapNote}</div>` : ""}
  `;
  main.querySelectorAll(".tabbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; renderMain(); });
  });
  main.querySelectorAll(".copy-prompt-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const target = document.getElementById(btn.dataset.copyTarget);
      if(!target) return;
      const original = btn.textContent;
      try {
        await navigator.clipboard.writeText(target.textContent);
        btn.textContent = "COPIED";
      } catch(err) {
        const range = document.createRange();
        range.selectNodeContents(target);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        btn.textContent = "SELECTED — COPY";
      }
      setTimeout(()=>{btn.textContent=original;},1400);
    });
  });
}

renderNav();
renderMain();
</script>
</body>
</html>
